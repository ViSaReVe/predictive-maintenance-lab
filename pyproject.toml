[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "predictive-maintenance-lab"
version = "0.1.0"
description = "End-to-end predictive maintenance: RUL prediction + bearing anomaly detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "torch>=2.0",
    "xgboost>=1.7",
    "pyyaml>=6.0",
    "mlflow>=2.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
train-cmapss = "scripts.train_cmapss:main"
train-cwru = "scripts.train_cwru:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
