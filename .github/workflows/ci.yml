name: CI

# Runs on every push and pull request
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ── Job 1: Lint with ruff ────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ api/ pipelines/ tests/ main.py

  # ── Job 2: Tests ─────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Tests use synthetic fixtures — no real data files needed
        run: pytest tests/ -v --tb=short

  # ── Job 3: Docker build (only on push to main) ───────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]    # only build if lint + tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pdm-api:${{ github.sha }} .

      - name: Smoke test — models load and API responds
        run: |
          docker run -d --name pdm-smoke \
            -e MODEL_DIR=models \
            -e TRAIN_ENABLED=false \
            -p 8000:8000 \
            pdm-api:${{ github.sha }}
          sleep 8
          HEALTH=$(curl -sf --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8000/ || echo "failed")
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"cmapss_rul":"loaded"' || (echo "ERROR: CMAPSS model not loaded" && exit 1)
          echo "$HEALTH" | grep -q '"cwru_anomaly":"loaded"' || (echo "ERROR: CWRU model not loaded" && exit 1)
          docker stop pdm-smoke
